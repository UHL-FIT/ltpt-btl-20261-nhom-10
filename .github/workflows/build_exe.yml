name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # Chạy mỗi khi bạn push một tag bắt đầu bằng 'v' (ví dụ: v1.0.0)

jobs:
  build:
    runs-on: windows-latest # Chạy trên máy ảo Windows của GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Phiên bản Python bạn đang dùng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          python build.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyWarehouse-${{ github.ref_name }} # Tên tệp hiển thị trên GitHub
          path: dist/PyWarehouse.exe # Đường dẫn tới file exe của bạn
          retention-days: 90